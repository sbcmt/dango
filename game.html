<!DOCTYPE html>
<html lang="ja">
<head>

  <title>ガラガラ抽選 | DANGO</title>

  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--pink:#f74783;--deep:#cf2968;--ink:#573b49;--sub:#947487;--gold:#ffc94e;--cream:#fffdf8;--mint:#d8f5be;--shadow:0 14px 40px #a84f7220}
    *{box-sizing:border-box} [hidden]{display:none!important}
    body{margin:0;color:var(--ink);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;font-weight:700;background:radial-gradient(circle at 13% 10%,#ffedba 0,transparent 30%),radial-gradient(circle at 92% 3%,#ffd9e8 0,transparent 33%),linear-gradient(160deg,#fff2f6,#fffdf8 65%);min-height:100vh;min-height:100dvh}
    button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer;touch-action:manipulation}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #7552cf;outline-offset:4px}
    .shell{max-width:1000px;margin:auto;padding:18px 18px max(30px,env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
    .brand{font-size:25px;font-weight:900;letter-spacing:-.04em;white-space:nowrap;display:flex;gap:.01em;filter:drop-shadow(1px 3px 0 #fff)}.brand span:nth-child(1){color:#ef5893;transform:rotate(-7deg)}.brand span:nth-child(2){color:#e7a428;transform:rotate(5deg)}.brand span:nth-child(3){color:#61b884;transform:rotate(-5deg)}.brand span:nth-child(4){color:#9977cc;transform:rotate(6deg)}.brand span:nth-child(5){color:#ef9252;transform:rotate(-4deg)}
    .nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.nav a,.nav button{background:#fff;border:1px solid #f4dae4;border-radius:100px;padding:9px 13px;color:#a3476f;font-size:12px;font-weight:900;box-shadow:0 2px 5px #bb748c13}.nav button:disabled{opacity:.35;cursor:not-allowed}
    .main{margin-top:15px;min-height:550px;background:#fffeffdf;border:2px solid white;border-radius:30px;box-shadow:var(--shadow);text-align:center;padding:21px clamp(14px,4vw,32px) 24px;display:flex;flex-direction:column;align-items:center}
    .eyebrow{font-size:12px;letter-spacing:.13em;color:var(--deep);font-weight:900}.title{font-size:clamp(23px,4vw,31px);margin:6px 0 4px}.hint{color:var(--sub);font-size:13px;line-height:1.6;margin:0}
    .tags{display:flex;justify-content:center;gap:9px;margin:13px 0 8px;flex-wrap:wrap}.tag{font-size:12px;padding:7px 11px;border-radius:100px;background:#fff2d8;color:#8f6540}.tag:nth-child(2){background:#f5eaff;color:#8d6599}
    .stage{display:flex;align-items:center;justify-content:center;flex:1;width:100%;min-height:0;padding:14px 0 12px}
    /* v5: precisely double the former desktop ball's diameter (35vw -> 70vw, 362 -> 724px).
       On narrow screens, keep the whole circle visible instead of cropping it. */
    .ball{width:clamp(440px,70vw,724px);height:auto;aspect-ratio:1;flex:0 0 auto;border-radius:50%;border:9px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 9px 0 #e7b4c9,0 18px 30px #b5678530,inset -10px -14px 25px #c7518630;background:radial-gradient(circle at 28% 19%,#fff 0,#ffecf5 23%,#ffa4c7 63%,#f16b9e 100%);transform:translateZ(0);overflow:hidden}
    .ball:before{content:'';position:absolute;left:17%;top:12%;width:22%;height:12%;border-radius:50%;transform:rotate(-35deg);background:#ffffff9b;filter:blur(4px)}
    .ball .letter{font-size:clamp(60px,14vw,98px);line-height:1;margin-bottom:8px;color:#8d2756;font-weight:900;text-shadow:0 2px #fff8}.ball .number{font-size:clamp(224px,36vw,380px);letter-spacing:-.085em;line-height:.95;font-weight:900;color:#fff;text-shadow:3px 6px 0 #b23f78,0 4px 19px #ce437170;padding-right:.08em;font-variant-numeric:tabular-nums}
    .ball.wait .number{font-size:clamp(198px,32vw,336px)}.ball.wait .letter{font-size:44px}.ball.spin{animation:rumble .12s linear infinite alternate}.ball.pop{animation:pop .5s cubic-bezier(.2,1.9,.35,1)}
    .ball.type-I{background:radial-gradient(circle at 28% 19%,white 0,#ffefbc 23%,#f8c85d 65%,#efa838 100%)}.ball.type-N{background:radial-gradient(circle at 28% 19%,white 0,#e6f9da 23%,#83d4a3 65%,#52b987 100%)}.ball.type-G{background:radial-gradient(circle at 28% 19%,white 0,#f4ebff 23%,#b6a1ee 65%,#997cdd 100%)}.ball.type-O{background:radial-gradient(circle at 28% 19%,white 0,#ffeedb 23%,#fab078 65%,#ed8b5b 100%)}
    .stage-line{font-size:15px;color:#a64a75;min-height:25px;margin:0 0 13px}.stage-line strong{color:var(--deep)}
    .roll{width:min(100%,460px);padding:16px 24px;border:0;border-radius:21px;background:linear-gradient(180deg,#fa649f,#ec347b);color:#fff;font-size:clamp(20px,5vw,26px);font-weight:900;box-shadow:0 7px 0 #bb2e67,0 15px 24px #ec50914b;transition:transform .13s,box-shadow .13s}.roll:not(:disabled):active{transform:translateY(5px);box-shadow:0 2px 0 #bb2e67}.roll:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}
    .info{margin-top:17px;display:flex;gap:12px;width:min(100%,460px)}.info>div{flex:1;border-radius:16px;padding:11px;background:#fff0f6}.info>div:nth-child(2){background:#fff2d8}.info small{display:block;color:#8c6176;font-size:11px}.info strong{font-size:25px;font-variant-numeric:tabular-nums}.subnav{margin-top:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.subnav a,.subnav button{border:0;background:transparent;color:#aa5576;text-decoration:underline;font-size:13px;padding:8px;font-weight:900}.subnav button:disabled{opacity:.3}
    .notice{margin:18px auto 0;max-width:670px;border-radius:17px;background:#fff5d8;color:#8a703c;padding:14px 18px;font-size:13px;line-height:1.7}.error{background:#ffdee5;color:#a53464}.toast{position:fixed;bottom:18px;left:18px;right:18px;margin:auto;width:max-content;max-width:calc(100% - 36px);border-radius:16px;background:#573b49;color:#fff;padding:12px 20px;box-shadow:0 8px 30px #412c3677;font-size:13px;text-align:center;z-index:9}
    @keyframes rumble{0%{transform:translate(-3px,1px) rotate(-2deg)}100%{transform:translate(3px,-2px) rotate(2deg)}}@keyframes pop{0%{transform:scale(.75)}65%{transform:scale(1.075)}100%{transform:scale(1)}}
    @media(max-width:520px){.shell{padding:12px 10px 25px}.top{gap:8px}.brand{font-size:22px}.nav a,.nav button{padding:8px 10px;font-size:11px}.main{padding:20px 12px 23px;border-radius:25px;min-height:calc(100dvh - 98px)}.stage{min-height:0}.ball{width:calc(100vw - 48px);max-width:472px;border-width:7px}.ball .letter{font-size:clamp(32px,10vw,52px);margin-bottom:4px}.ball .number{font-size:clamp(112px,37vw,190px)}.ball.wait .number{font-size:clamp(84px,26vw,140px)}.ball.wait .letter{font-size:24px}.info strong{font-size:22px}}
    /* v6: keep the larger portrait ball, but scale the landscape ball to ~60% of v5. 
       Restrict by available screen height so landscape phones do not crop the circle. */
    @media (orientation: landscape){
      .ball{width:min(42vw, 434px, 60dvh);max-width:100%;border-width:clamp(5px, .7vw, 9px)}
      .ball .letter{font-size:min(8.4vw, 59px, 8dvh);margin-bottom:5px}
      .ball .number{font-size:min(21.6vw, 228px, 28dvh)}
      .ball.wait .number{font-size:min(19.2vw, 202px, 26dvh)}
      .ball.wait .letter{font-size:min(44px, 6dvh)}
    }
    /* v7: three buttons; neutral until the selected cards really have reach / bingo */
    .action-row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;width:min(100%,720px);align-items:stretch}
    .action-row .roll{width:100%;min-width:0;padding:15px 10px;font-size:clamp(15px,2.5vw,23px);border-radius:19px}
    .roll-short{display:none}
    .judge{border:2px solid #e3e0e5;border-radius:19px;background:linear-gradient(#eeedf0,#e4e3e8);color:#95909a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;padding:8px 4px;cursor:not-allowed;box-shadow:none;transition:transform .15s,box-shadow .15s,background .15s}
    .judge .judge-name{font-size:clamp(13px,1.9vw,18px);font-weight:900;white-space:nowrap}
    .judge .judge-count{font-size:clamp(16px,2.5vw,25px);font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
    .judge.active{cursor:pointer;color:#694527;box-shadow:0 5px 0 #dbab36;transform:translateY(-3px);border-color:#ffdf7a;background:linear-gradient(#fff0b0,#ffd767)}
    .judge.active.bingo{color:white;box-shadow:0 5px 0 #ad2f7a;border-color:#f49ccb;background:linear-gradient(#f683b5,#eb4592)}
    .judge.active:active{transform:translateY(1px);box-shadow:0 1px 0 #b67d4c}
    .judge.active.bingo:active{box-shadow:0 1px 0 #ad2f7a}
    .judge:disabled{cursor:not-allowed}
    .judge.active:focus-visible{outline:3px solid #8452bb;outline-offset:4px}
    .info{width:min(100%,720px)}
    .result-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:clamp(14px,3vw,28px);background:#332532aa;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
    .result-modal{position:relative;display:flex;flex-direction:column;width:min(100%,780px);max-height:min(88dvh,800px);overflow:hidden;border:4px solid #fff;border-radius:30px;background:linear-gradient(150deg,#fff5f8,#fffdf7);box-shadow:0 28px 85px #210c204f;padding:clamp(18px,3vw,30px);text-align:center}
    .modal-close{position:absolute;top:12px;right:12px;border:0;border-radius:100px;background:#f3e7ee;color:#875976;width:44px;height:44px;display:grid;place-items:center;font-size:24px;font-weight:900}
    .modal-eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;color:#b04476;margin:0 44px 3px}
    .modal-title{font-size:clamp(30px,6vw,48px);font-weight:900;line-height:1.2;margin:0 40px 6px}
    .modal-title.reach{color:#c18a24}.modal-title.bingo{color:#e3408b}
    .modal-caption{color:#987789;font-size:clamp(12px,2.2vw,15px);line-height:1.6;margin:4px 12px 14px}
    .result-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));align-content:start;gap:10px;overflow:auto;min-height:0;padding:4px 3px 14px;overscroll-behavior:contain}
    .number-chip{border-radius:17px;padding:14px 9px;background:#fff1b3;color:#98622a;border:2px solid #ffdf77;font-weight:900;display:flex;align-items:center;justify-content:center;gap:4px;flex-direction:column;font-size:clamp(19px,4vw,30px);font-variant-numeric:tabular-nums}
    .number-chip.reach{background:#ffe9ab;color:#8c641d;border-color:#fbd475}
    .number-chip.bingo-new{background:linear-gradient(135deg,#ff79b0,#ee428e);color:#fff;border-color:#f7a7ce;box-shadow:0 4px 12px #ec4d9944}
    .number-chip.bingo-old{background:#ecebef;color:#a2a0a8;border-color:#e0dde3}
    .number-chip small{font-size:11px;line-height:1.1;letter-spacing:.02em}
    .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#877383}
    .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;background:#f15397}.legend .past-dot{background:#b7b5bc}
    @media(max-width:520px){.action-row{gap:6px;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr)}.action-row .roll{font-size:17px;padding:11px 4px;border-radius:16px}.roll-long{display:none}.roll-short{display:inline}.judge{border-radius:16px;padding:7px 2px}.judge .judge-name{font-size:13px}.judge .judge-count{font-size:18px}.result-list{grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:8px}.number-chip{padding:12px 4px;font-size:21px}.result-modal{border-radius:22px;padding:18px 12px}.info{gap:6px}}
    @media(max-height:470px) and (orientation:landscape){.result-modal{max-height:94dvh;padding:9px 16px}.modal-eyebrow{font-size:10px}.modal-title{font-size:27px}.modal-caption{margin:0 8px 5px;font-size:12px}.number-chip{padding:7px 5px}.legend{margin-top:4px}.modal-close{top:5px;right:7px;width:34px;height:34px}.result-list{grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:7px}}
    @media(prefers-reduced-motion:reduce){.ball.spin,.ball.pop{animation:none}.roll{transition:none}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a href="./index.html" class="brand" aria-label="DANGO カード選択へ"><span>D</span><span>A</span><span>N</span><span>G</span><span>O</span></a>
    <nav class="nav" aria-label="ページ移動"><a href="./index.html" id="backToCards">‹ カード選択</a><a href="./history.html" id="historyNav">出た数字を見る ↗</a><a href="./setting.html?from=game" id="settingsNav">⚙ 設定</a><button type="button" id="soundButton" aria-pressed="true">🔊 音 ON</button></nav>
  </header>
  <main class="main" id="gamePanel">
    <div class="eyebrow">STEP 02 / BINGO TIME!</div>
    <h1 class="title">ガラガラ抽選！</h1>
    <p class="hint" id="guide">ボタンを押して、ビンゴを始めよう！</p>
    <div class="tags"><span class="tag" id="speedLabel">⏱ 4秒で抽選</span><span class="tag" id="cardsLabel">🎟 0枚でプレイ</span></div>
    <div class="stage">
      <div class="ball wait" id="ball" aria-hidden="true"><div class="letter" id="ballLetter">LET'S</div><div class="number" id="ballNumber">GO!</div></div>
    </div>
    <div class="stage-line" id="resultLine" aria-live="polite">さあ、回してみよう！</div>
    <div class="action-row" aria-label="抽選・判定操作">
      <button class="roll" id="rollButton" type="button"><span class="roll-long">🎱 ガラガラ回す！</span><span class="roll-short">🎱 回す！</span></button>
      <button class="judge reach" id="reachButton" type="button" disabled><span class="judge-name">リーチ</span><strong class="judge-count" id="reachCount">0</strong></button>
      <button class="judge bingo" id="bingoButton" type="button" disabled><span class="judge-name">ビンゴ</span><strong class="judge-count" id="bingoCount">0</strong></button>
    </div>
    <div class="info"><div><small>出た数字</small><strong id="drawCount">0 / 75</strong></div><div><small>残り</small><strong id="remainingCount">75 個</strong></div></div>
    <div class="subnav"><a href="./history.html" id="historyLink">🔢 出た数字を確認する</a><button type="button" id="restartButton">↺ 最初からやり直す</button></div>
  </main>
  <div id="resultOverlay" class="result-overlay" hidden>
    <section class="result-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalCaption">
      <button class="modal-close" id="closeResults" type="button" aria-label="閉じる">×</button>
      <div class="modal-eyebrow" id="modalEyebrow">DANGO / RESULTS</div>
      <h2 class="modal-title" id="modalTitle">リーチ</h2>
      <p class="modal-caption" id="modalCaption"></p>
      <div class="result-list" id="resultList" role="list"></div>
      <div class="legend" id="bingoLegend" hidden><span><i></i>今回ビンゴ</span><span><i class="past-dot"></i>過去のビンゴ</span></div>
    </section>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script>
'use strict';
// Local-only DANGO draw: draw results are stored on this device, not synced between devices.
const GAME_KEY='dango.gameSession.v1';
const SPEED_KEY='dango.drawSpeedSeconds.v1'; // Future settings screen can set this to 2, 4 or 6.
const SOUND_KEY='dango.soundEnabled.v1';
const VOLUME_KEY='dango.soundVolume.v1';
const $=(id)=>document.getElementById(id);
const groupOf=(n)=>'BINGO'[Math.floor((n-1)/15)];
const labelOf=(n)=>groupOf(n)+'-'+n;
const safeNum=(n)=>Number.isInteger(n)&&n>=1&&n<=75;
let game=null,rolling=false,audioCtx=null,rattleTimer=null,timeoutId=null,animationFrame=0,toastTimeout=null;
let soundEnabled=true, speedSeconds=4, volumePercent=70, updateBusy=false, updateAvailable=false;
function readJSON(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
function save(){try{localStorage.setItem(GAME_KEY,JSON.stringify(game));return true}catch{toast('端末に抽選データを保存できません。空き容量・保存設定をご確認ください。');return false}}
function validGame(x){return x&&x.version===1&&Array.isArray(x.selectedCards)&&x.selectedCards.length>0&&x.selectedCards.every(n=>Number.isInteger(n)&&n>=1&&n<=250)&&new Set(x.selectedCards).size===x.selectedCards.length&&Array.isArray(x.drawn)&&x.drawn.every(safeNum)&&new Set(x.drawn).size===x.drawn.length&&(!x.pending||(safeNum(x.pending.number)&&!x.drawn.includes(x.pending.number)&&Number.isFinite(x.pending.startedAt))) }
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toast').hidden=true,3000)}
function notice(msg,isError=false){$('notice').hidden=!msg;$('notice').textContent=msg;$('notice').classList.toggle('error',isError)}
function loadPreferences(){try{soundEnabled=localStorage.getItem(SOUND_KEY)!=='false';const speed=Number(localStorage.getItem(SPEED_KEY));speedSeconds=[2,4,6].includes(speed)?speed:4;const vol=localStorage.getItem(VOLUME_KEY);volumePercent=vol===null?70:Math.min(100,Math.max(0,Number.isFinite(Number(vol))?Number(vol):70))}catch{}$('soundButton').textContent=soundEnabled?'🔊 音 ON':'🔇 音 OFF';$('soundButton').setAttribute('aria-pressed',String(soundEnabled));$('speedLabel').textContent=`⏱ ${speedSeconds}秒で抽選`}
const CARD_URL='./cards.json';
let cardGrids=new Map(), cardsReady=false, judgeState={reach:[],bingo:[],justBingo:[]};
let modalFocusReturn=null;
// Validate actual photos' transcribed 5x5 grids. Never compute a result using missing/invalid card data.
function validGrid(grid){
  if(!Array.isArray(grid)||grid.length!==5||!grid.every(row=>Array.isArray(row)&&row.length===5)||grid[2][2]!==null)return false;
  const taken=new Set();
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    if(r===2&&c===2)continue;
    const n=grid[r][c];if(!Number.isInteger(n)||n<c*15+1||n>(c+1)*15||taken.has(n))return false;taken.add(n);
  }
  return taken.size===24;
}
function bingoLines(grid){
  const lines=[];
  for(let r=0;r<5;r++)lines.push(grid[r]);
  for(let c=0;c<5;c++)lines.push(grid.map(row=>row[c]));
  lines.push(grid.map((row,r)=>row[r]));
  lines.push(grid.map((row,r)=>row[4-r]));
  return lines;
}
function getBoardState(grid,called){
  let reach=false;
  for(const line of bingoLines(grid)){
    let missing=0;
    for(const n of line)if(n!==null&&!called.has(n))missing++;
    if(missing===0)return 'bingo';
    if(missing===1)reach=true;
  }
  return reach?'reach':'none';
}
function judgeAt(numbers){
  const called=new Set(numbers),reach=[],bingo=[];
  if(!game||!cardsReady)return {reach,bingo};
  for(const id of game.selectedCards){
    const grid=cardGrids.get(id);if(!grid)continue;
    const status=getBoardState(grid,called);
    if(status==='bingo')bingo.push(id);
    else if(status==='reach')reach.push(id);
  }
  reach.sort((a,b)=>a-b);bingo.sort((a,b)=>a-b);
  return {reach,bingo};
}
function refreshJudge(){
  const current=judgeAt(game?.drawn||[]);
  const previous=judgeAt(game?.drawn.slice(0,-1)||[]);
  const priorSet=new Set(previous.bingo);
  judgeState={...current,justBingo:current.bingo.filter(id=>!priorSet.has(id))};
  for(const [name,elementId] of [['reach','reachButton'],['bingo','bingoButton']]){
    const count=judgeState[name].length,btn=$(elementId);
    $(name+'Count').textContent=count;
    btn.classList.toggle('active',count>0&&cardsReady);
    btn.disabled=!cardsReady||!game||rolling||count===0;
    btn.setAttribute('aria-label',`${name==='reach'?'リーチ':'ビンゴ'} ${count}枚。${count?'一覧を開く':'まだありません'}`);
  }
}
async function loadCardGrids(){
  cardsReady=false;refreshJudge();
  if(!game)return;
  try{
    const url=new URL(CARD_URL,document.baseURI);url.searchParams.set('_fresh',String(Date.now()));
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw Error('cards.jsonを取得できません (HTTP '+response.status+')');
    const data=await response.json();if(!Array.isArray(data.cards))throw Error('cards.jsonの形式が違います');
    const next=new Map();for(const c of data.cards){
      if(!c||!Number.isInteger(c.id)||next.has(c.id)||!validGrid(c.grid))throw Error('カードデータの数字に問題があります。No.'+(c?.id||'?'));
      next.set(c.id,c.grid);
    }
    const absent=game.selectedCards.filter(id=>!next.has(id));
    if(absent.length)throw Error('選択カードのデータが不足しています: No.'+absent.join(', No.'));
    cardGrids=next;cardsReady=true;notice('');refreshJudge();
    refreshDisplay();
  }catch(err){
    cardsReady=false;cardGrids.clear();refreshJudge();
    notice('判定に必要なカードデータを確認できません。安全のため抽選を停止しました。'+(err?.message||''),true);
    refreshDisplay();
  }
}
function setRollText(text,shortText){$('rollButton').innerHTML=`<span class="roll-long">${text}</span><span class="roll-short">${shortText||text}</span>`}
function showResults(kind){
  if(!game||rolling||!cardsReady||!judgeState[kind].length)return;
  const list=$('resultList');list.replaceChildren();
  const isBingo=kind==='bingo',ids=judgeState[kind];
  $('modalEyebrow').textContent=isBingo?'🎉 BINGO RESULTS':'✨ REACH NOW';
  $('modalTitle').textContent=isBingo?'ビンゴ！':'リーチ！';
  $('modalTitle').className='modal-title '+kind;
  $('modalCaption').textContent=isBingo?`ビンゴになったカード ${ids.length}枚（今回 ${judgeState.justBingo.length}枚）`:`現在リーチ中のカード ${ids.length}枚。ビンゴ成立カードは除外しています。`;
  $('bingoLegend').hidden=!isBingo;
  const just=new Set(judgeState.justBingo);
  const ordered=isBingo?[...ids].sort((a,b)=>Number(just.has(b))-Number(just.has(a))||a-b):ids;
  for(const id of ordered){
    const item=document.createElement('div');item.setAttribute('role','listitem');
    const isNew=isBingo&&just.has(id);
    item.className='number-chip '+(isBingo?(isNew?'bingo-new':'bingo-old'):'reach');
    const num=document.createElement('span');num.textContent='No.'+String(id).padStart(3,'0');item.appendChild(num);
    if(isBingo){const caption=document.createElement('small');caption.textContent=isNew?'今回のビンゴ！':'過去のビンゴ';item.appendChild(caption)}
    list.appendChild(item);
  }
  modalFocusReturn=document.activeElement;
  $('resultOverlay').hidden=false;$('closeResults').focus();
}
function closeResults(){if($('resultOverlay').hidden)return;$('resultOverlay').hidden=true;modalFocusReturn?.focus?.();modalFocusReturn=null}
$('reachButton').addEventListener('click',()=>showResults('reach'));
$('bingoButton').addEventListener('click',()=>showResults('bingo'));
$('closeResults').addEventListener('click',closeResults);
$('resultOverlay').addEventListener('click',event=>{if(event.target===$('resultOverlay'))closeResults()});
document.addEventListener('keydown',event=>{
  if($('resultOverlay').hidden)return;
  if(event.key==='Escape'){event.preventDefault();closeResults()}
  if(event.key==='Tab'){event.preventDefault();$('closeResults').focus()}
});
function updateCounter(){const count=game?game.drawn.length:0;$('drawCount').textContent=`${count} / 75`;$('remainingCount').textContent=`${75-count} 個`;if(game)$('cardsLabel').textContent=`🎟 ${game.selectedCards.length}枚でプレイ`}
function displayNumber(n){const ball=$('ball');ball.className='ball pop type-'+groupOf(n);$('ballLetter').textContent=groupOf(n);$('ballNumber').textContent=String(n);$('resultLine').textContent=labelOf(n)+' が出ました！';$('guide').textContent='次の数字を出すときは、もう一度回してね！'}
function displayWaiting(){$('ball').className='ball wait';$('ballLetter').textContent="LET'S";$('ballNumber').textContent='GO!';$('resultLine').textContent='さあ、回してみよう！';$('guide').textContent='ボタンを押して、ビンゴを始めよう！'}
function refreshDisplay(){if(!game){$('rollButton').disabled=true;setRollText('カードを選んでね','カード未選択');$('restartButton').disabled=true;refreshJudge();notice('カードが選択されていません。「カード選択」から使う番号を選び、「ゲームを始める」を押してください。',true);return}
  updateCounter();$('restartButton').disabled=false;
  if(game.drawn.length){displayNumber(game.drawn[game.drawn.length-1])}else{displayWaiting()}
  const done=game.drawn.length===75;$('rollButton').disabled=done||!cardsReady||rolling;setRollText(done?'🎉 75個すべて抽選完了！':cardsReady?'🎱 ガラガラ回す！':'⏳ カード読込中',done?'抽選完了！':cardsReady?'🎱 回す！':'読込中');refreshJudge();
  if(done){$('guide').textContent='すべての数字が出ました！';$('resultLine').textContent='🎉 抽選完了！ おつかれさま！'}
}
function randomIndex(length){if(length<=1)return 0;const max=0x100000000;const limit=Math.floor(max/length)*length;const nums=new Uint32Array(1);let n;do{crypto.getRandomValues(nums);n=nums[0]}while(n>=limit);return n%length}
function remainingNumbers(){const taken=new Set(game.drawn);if(game.pending)taken.add(game.pending.number);return Array.from({length:75},(_,i)=>i+1).filter(n=>!taken.has(n))}
function soundContext(){if(!soundEnabled||volumePercent<=0)return null;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audioCtx)audioCtx=new C();if(audioCtx.state!=='running')audioCtx.resume().catch(()=>{});return audioCtx}catch{return null}}
function shortRattle(ctx){if(!ctx||ctx.state!=='running')return;
  const when=ctx.currentTime;const len=.06;const buffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*len),ctx.sampleRate);const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){const fade=(1-i/data.length);data[i]=(Math.random()*2-1)*fade*fade}
  const src=ctx.createBufferSource();src.buffer=buffer;
  const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=850+Math.random()*900;filter.Q.value=.7;
  const gain=ctx.createGain();gain.gain.setValueAtTime(0,when);gain.gain.linearRampToValueAtTime(.18*volumePercent/100,when+.006);gain.gain.exponentialRampToValueAtTime(.001,when+len);
  src.connect(filter);filter.connect(gain);gain.connect(ctx.destination);src.start(when);src.stop(when+len+.008);
}
function startRattle(){const ctx=soundContext();if(!ctx)return;shortRattle(ctx);rattleTimer=setInterval(()=>shortRattle(ctx),105)}
function stopRattle(){if(rattleTimer!==null){clearInterval(rattleTimer);rattleTimer=null}}
function finishSound(){const ctx=soundContext();if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime;
  [659.25,830.61,987.77].forEach((freq,i)=>{const osc=ctx.createOscillator();const g=ctx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(.001,t+i*.095);g.gain.exponentialRampToValueAtTime(Math.max(.0011,.13*volumePercent/100),t+i*.095+.015);g.gain.exponentialRampToValueAtTime(.001,t+i*.095+.27);osc.connect(g);g.connect(ctx.destination);osc.start(t+i*.095);osc.stop(t+i*.095+.3)})
}
function cleanTimers(){stopRattle();clearTimeout(timeoutId);cancelAnimationFrame(animationFrame);rolling=false}
function finishDraw(){if(!game||!game.pending)return;const number=game.pending.number;if(!safeNum(number)||game.drawn.includes(number)){cleanTimers();notice('保存済みの抽選データに異常があります。新しい抽選は停止しました。',true);return}
  const previous=game.pending;game.drawn.push(number);game.pending=null;
  if(!save()){game.drawn.pop();game.pending=previous;cleanTimers();notice('数字の保存に失敗しました。再読み込みせず、端末の保存設定をご確認ください。',true);return}
  cleanTimers();['historyNav','historyLink'].forEach(id=>$(id).removeAttribute('aria-disabled'));refreshDisplay();if(judgeState.justBingo.length){$('resultLine').textContent=`🎉 今回 ${judgeState.justBingo.length}枚がビンゴ！`;toast(`🎉 BINGO！ No.${judgeState.justBingo.map(id=>String(id).padStart(3,'0')).join('・No.')}`)}finishSound();if(updateAvailable)reloadFresh();
}
function animateRoll(){if(!game||!game.pending)return;const elapsed=Date.now()-game.pending.startedAt, duration=game.pending.durationMs||4000;
  if(elapsed>=duration){finishDraw();return}
  const choices=remainingNumbers(); // Cosmetic numbers ONLY. The reserved true result is not shown early.
  if(choices.length){const preview=choices[Math.floor(Math.random()*choices.length)];$('ball').className='ball spin type-'+groupOf(preview);$('ballLetter').textContent=groupOf(preview);$('ballNumber').textContent=String(preview)}else{$('ball').className='ball spin wait';$('ballLetter').textContent='NEXT';$('ballNumber').textContent='??'}
  $('resultLine').textContent=`ガラガラ… あと${Math.max(1,Math.ceil((duration-elapsed)/1000))}秒！`;
  const progress=elapsed/duration;const delay=progress>.85?185:progress>.62?110:65;
  timeoutId=setTimeout(()=>animationFrame=requestAnimationFrame(animateRoll),delay)
}
function startDraw(){if(!game||!cardsReady||rolling||game.pending||game.drawn.length>=75)return;closeResults();
  const remaining=remainingNumbers();if(!remaining.length)return;
  const number=remaining[randomIndex(remaining.length)]; // Actual number selected uniformly and reserved BEFORE animation.
  game.pending={number,startedAt:Date.now(),durationMs:speedSeconds*1000};
  if(!save()){game.pending=null;return}
  rolling=true;notice('');$('rollButton').disabled=true;setRollText('🎱 ガラガラ中…','ガラガラ中');refreshJudge();$('historyNav').setAttribute('aria-disabled','true');$('historyLink').setAttribute('aria-disabled','true');$('restartButton').disabled=true;
  startRattle();animateRoll();
}
function restorePending(){if(!game||!game.pending)return;
  // An interrupted number is already reserved: resume its remaining time, never redraw it.
  const remaining=(game.pending.startedAt+(game.pending.durationMs||4000))-Date.now();
  if(remaining<=0){finishDraw();toast('途中だった抽選結果を復元しました。');return;}
  rolling=true;$('rollButton').disabled=true;setRollText('🎱 ガラガラ中…','ガラガラ中');refreshJudge();$('restartButton').disabled=true;
  $('historyNav').setAttribute('aria-disabled','true');$('historyLink').setAttribute('aria-disabled','true');
  animateRoll();toast('途中だった抽選を再開しました。音は次の抽選から鳴ります。');
}
function resetGame(){if(!game||rolling)return;if(!confirm('抽選したすべての数字を消して、最初からやり直しますか？ この操作は元に戻せません。'))return;
  closeResults();const old=game;game={version:1,selectedCards:[...old.selectedCards],drawn:[],pending:null,createdAt:Date.now()};if(!save()){game=old;return}notice('');refreshDisplay();toast('新しいゲームを始めました！')
}
$('rollButton').addEventListener('click',startDraw);
$('restartButton').addEventListener('click',resetGame);
$('soundButton').addEventListener('click',()=>{soundEnabled=!soundEnabled;try{localStorage.setItem(SOUND_KEY,String(soundEnabled))}catch{}loadPreferences();if(soundEnabled){soundContext();toast('音をONにしました')}else{stopRattle();toast('音をOFFにしました')}});
for(const id of ['historyNav','historyLink','backToCards','settingsNav'])$(id).addEventListener('click',(e)=>{if(rolling){e.preventDefault();toast('抽選中です。数字が確定してから移動してください。')}});
window.addEventListener('storage',(event)=>{if([SPEED_KEY,SOUND_KEY,VOLUME_KEY].includes(event.key)){const wasSound=soundEnabled;loadPreferences();if(wasSound&&!soundEnabled)stopRattle()}if(event.key===GAME_KEY&&!rolling){const next=readJSON(GAME_KEY);if(validGame(next)){const selectedChanged=game?.selectedCards?.join(',')!==next.selectedCards.join(',');game=next;refreshDisplay();if(selectedChanged)loadCardGrids()}}});
window.addEventListener('pagehide',()=>{stopRattle();clearTimeout(timeoutId);cancelAnimationFrame(animationFrame)});
// Update check is bypass-cache; defer refreshing until any roll has been committed.
function reloadFresh(){const url=new URL(location.href);url.searchParams.set('dango_update',String(Date.now()));location.replace(url.href)}
async function checkUpdates(){if(updateBusy||document.visibilityState==='hidden'||navigator.onLine===false)return;updateBusy=true;
  try{const url=new URL('game.html',document.baseURI);url.searchParams.set('_fresh',String(Date.now()));const res=await fetch(url,{cache:'no-store'});if(!res.ok)return;
    const source=await res.text();const remoteDoc=new DOMParser().parseFromString(source,'text/html');
    const remoteCode=remoteDoc.querySelector('body script')?.textContent;
    const currentCode=document.querySelector('body script')?.textContent;
    const remoteStyle=remoteDoc.querySelector('style')?.textContent;
    const currentStyle=document.querySelector('style')?.textContent;
    if(remoteCode&&((remoteCode!==currentCode)||(remoteStyle!==currentStyle))){updateAvailable=true;if(!rolling)reloadFresh()}
  }catch{}finally{updateBusy=false}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){loadPreferences();if(game?.pending && Date.now()>=game.pending.startedAt+(game.pending.durationMs||4000))finishDraw();checkUpdates()}});
window.addEventListener('focus',checkUpdates);
loadPreferences();game=readJSON(GAME_KEY);
if(!validGame(game)){game=null;refreshDisplay()}else{refreshDisplay();restorePending();loadCardGrids()}
setInterval(checkUpdates,60000);
</script>
