:root{--ink:#573b49;--pink:#f74783;--deep:#d42f6e;--sub:#967887}*{box-sizing:border-box}body{font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;font-weight:700;margin:0;color:var(--ink);background:linear-gradient(140deg,#fff0f6,#fffdf8 70%);min-height:100vh}a{color:inherit;text-decoration:none}a:focus-visible{outline:3px solid #7552cf;outline-offset:3px}.wrap{max-width:940px;margin:auto;padding:18px 16px 42px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:900;color:var(--pink);letter-spacing:-.055em;font-size:24px}.back{display:inline-block;background:#fff;border:1px solid #f4d8e3;border-radius:100px;padding:10px 16px;color:#aa4871;font-size:13px}.panel{background:#fff;border:2px solid white;border-radius:27px;box-shadow:0 15px 36px #a74e701c;padding:24px 19px;margin-top:18px}.eyebrow{color:#d33872;letter-spacing:.12em;font-size:12px}h1{font-size:clamp(23px,5vw,32px);margin:6px 0}p{margin:0;color:var(--sub);font-size:13px}.summary{display:flex;gap:12px;margin:19px 0}.counter{border-radius:16px;background:#ffe5ee;padding:10px 16px;flex:1}.counter:nth-child(2){background:#fff2ca}.counter small{display:block;color:#9a6d82;font-size:12px}.counter strong{font-size:27px}.sheet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.column{min-width:0}.headbox{text-align:center;border-radius:13px 13px 4px 4px;padding:9px 4px;background:#f66b9c;color:white;font-size:22px;font-weight:900}.column:nth-child(2) .headbox{background:#e9b540}.column:nth-child(3) .headbox{background:#70c18e}.column:nth-child(4) .headbox{background:#a78ade}.column:nth-child(5) .headbox{background:#eb965b}.cell{border:1px solid #f4e3e9;border-radius:10px;display:grid;place-items:center;min-height:34px;margin-top:6px;background:#faf7f8;color:#b8a6af;font-size:clamp(12px,3.4vw,16px);font-weight:900;font-variant-numeric:tabular-nums}.cell.hit{background:#f74783;color:#fff;border-color:#e03879;box-shadow:0 2px 0 #c <body><div class="wrap"><header class="head"><span class="brand">DANGO 🍡</span><a class="back" href="./game.html">‹ 抽選画面に戻る</a></header><main class="panel"><div class="eyebrow">STEP 03 / 出た数字</div><h1>どの数字が出たかな？</h1><p>色がついている数字が、これまでに確定した数字です。</p><div class="summary"><div class="counter"><small>出た数字</small><strong id="drawCount">0 / 75</strong></div><div class="counter"><small>残りの数字</small><strong id="leftCount">75</strong></div></div><div id="sheet" class="sheet" aria-label="1〜75の抽選済み一覧"></div><h2 class="rowtitle">出た順番</h2><div id="order" class="list"></div><p class="foot">抽選履歴はこの端末にも保存されます。端末連携中はビンゴの結果を子端末にリアルタイム共有します。</p></main><div id="error" class="err" hidden></div><footer class="dango-copyright">© 2021–2026 dobhar-chu</footer></div>
<script>
'use strict';const GAME_KEY='dango.gameSession.v1';const $=id=>document.getElementById(id);const L='BINGO';let last='';
function load(){let game;try{game=JSON.parse(localStorage.getItem(GAME_KEY)||'null')}catch{}let drawn=(game&&Array.isArray(game.drawn))?game.drawn.filter(n=>Number.isInteger(n)&&n>=1&&n<=75):[];
  if(new Set(drawn).size!==drawn.length){$('error').hidden=false;$('error').textContent='抽選履歴に重複があります。登録内容をご確認ください。';return}
  const signature=JSON.stringify(drawn);if(signature===last)return;last=signature;
  $('drawCount').textContent=drawn.length+' / 75';$('leftCount').textContent=String(75-drawn.length);const hit=new Set(drawn);
  const sheet=$('sheet');sheet.replaceChildren();for(let col=0;col<5;col++){const block=document.createElement('section');block.className='column';const h=document.createElement('div');h.className='headbox';h.textContent=L[col];block.appendChild(h);for(let row=1;row<=15;row++){const n=col*15+row;const el=document.createElement('div');el.className='cell'+(hit.has(n)?' hit':'');el.textContent=String(n);el.setAttribute('aria-label',L[col]+n+(hit.has(n)?' 抽選済み':' 未抽選'));block.appendChild(el)}sheet.appendChild(block)}
  const order=$('order');order.replaceChildren();if(!drawn.length){const blank=document.createElement('div');blank.className='empty';blank.textContent='まだ数字が出ていません。抽選画面から回してね！';order.appendChild(blank)}else drawn.forEach((n,i)=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=`${i+1}. ${L[Math.floor((n-1)/15)]}-${n}`;order.appendChild(chip)})}
load();window.addEventListener('pageshow',load);window.addEventListener('storage',e=>{if(e.key===GAME_KEY)load()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(load,3000);
async function checkUpdate(){if(document.hidden)return;try{const url=new URL('./history.html',location.href);url.searchParams.set('_fresh',Date.now());const res=await fetch(url,{cache:'no-store'});if(!res.ok)return;const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');if(doc.querySelector('body script')?.textContent!==document.querySelector('body script')?.textContent || doc.querySelector('style')?.textContent!==document.querySelector('style')?.textContent){const next=new URL(location.href);next.searchParams.set('dango_update',Date.now());location.replace(next.href)}}catch{}}
setInterval(checkUpdate,60000);
</script></body></html>
