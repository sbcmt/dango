<style>
:root{--pink:#f74783;--deep:#cc2869;--ink:#573b49;--muted:#987a89;--cream:#fffdf8}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 18% 10%,#ffedba 0,transparent 35%),radial-gradient(circle at 92% 4%,#ffdbeb 0,transparent 42%),linear-gradient(140deg,#fff1f6,#fffdf8);color:var(--ink);font-family:'Zen Maru Gothic',sans-serif;font-weight:700}
button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #7655cb;outline-offset:3px}.wrap{max-width:900px;margin:auto;padding:18px clamp(10px,3vw,25px) max(20px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-size:27px;letter-spacing:-.05em;font-weight:900}.brand span:nth-child(1){color:#ef5893}.brand span:nth-child(2){color:#e7a428}.brand span:nth-child(3){color:#61b884}.brand span:nth-child(4){color:#9977cc}.brand span:nth-child(5){color:#ef9252}.top a.back{background:white;border:1px solid #f0dae4;border-radius:40px;padding:9px 14px;font-size:12px;color:#a3476f}.panel{background:#fffffff2;border:2px solid #fff;border-radius:27px;box-shadow:0 14px 40px #9f497321;padding:clamp(16px,4vw,30px);margin-top:17px;min-height:450px}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--deep);font-weight:900}h1{font-size:clamp(24px,5vw,33px);margin:6px 0}p{font-size:13px;color:var(--muted);line-height:1.65}label{display:block;font-size:13px;margin:18px 0 8px}input{border:2px solid #f4d4e2;border-radius:17px;background:white;padding:15px;width:100%;font-size:27px;font-weight:900;letter-spacing:.12em;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}input::placeholder{color:#c9bdc4;font-weight:500;letter-spacing:0}.join{width:100%;border:0;border-radius:17px;margin-top:13px;padding:15px;background:linear-gradient(110deg,#f35a93,#e73378);color:white;font-size:18px;font-weight:900;box-shadow:0 5px 0 #be2c65}.join:disabled{opacity:.55}.status{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:13px 0 16px;font-size:13px;color:#8a6580}.dot{display:inline-block;width:10px;height:10px;background:#9fa0a3;border-radius:50%}.dot.ok{background:#43ad71}.dot.no{background:#e38b3d}.topline{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.game-code{border-radius:100px;padding:7px 12px;background:#fff1d7;color:#865d37;font-size:13px}.stats{display:flex;gap:10px;margin:19px 0}.stat{flex:1;background:#ffe9f1;border-radius:19px;padding:13px}.stat:nth-child(2){background:#fff3db}.stat small{display:block;color:#92687c;font-size:11px}.stat strong{font-size:clamp(24px,4vw,34px);font-variant-numeric:tabular-nums}.subhead{font-size:17px;margin:21px 0 8px}.help{font-size:12px;color:#946c7c;margin:5px 0 17px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.chip{border:2px solid #e6e3e5;background:#efedef;color:#938d96;border-radius:17px;padding:15px 6px;text-align:center;min-width:0}.chip strong{display:block;font-size:clamp(19px,3.2vw,26px);font-variant-numeric:tabular-nums}.chip small{font-size:10px}.chip.new{border-color:#f59dc3;background:linear-gradient(145deg,#ffe5ef,#ffc4dc);color:#b82765;box-shadow:0 4px 0 #ec96b9}.empty{border-radius:17px;padding:24px 15px;text-align:center;background:#fff4df;color:#8a6941;font-size:14px}.error{border-radius:14px;background:#ffe2e8;color:#aa2d58;padding:15px;margin-top:14px;font-size:13px;line-height:1.6}.foot{margin-top:18px;text-align:center;color:#947f89;font-size:11px}.retry{border:1px solid #f4c8db;border-radius:50px;padding:8px 13px;color:#a13e6a;background:white;font-size:12px}
@media(max-width:490px){.wrap{padding:11px 10px 28px}.panel{padding:18px 13px}.list{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.chip{padding:13px 2px}.chip strong{font-size:18px}.chip small{font-size:9px}}
</style>
</head>
<body><div class="wrap"><header class="top"><a class="brand" href="./index.html" aria-label="DANGO"><span>D</span><span>A</span><span>N</span><span>G</span><span>O</span></a><a class="back" href="./index.html">‹ カード選択に戻る</a></header>
<main class="panel"><div class="eyebrow">DANGO / CARD CHECK</div><h1>ビンゴ確認</h1>
<section id="joinPanel"><p>抽選担当から教えてもらった8桁のゲームIDを入力してください。参加後は画面が自動更新されます。</p><form id="joinForm"><label for="codeInput">ゲームID（8桁の数字）</label><input id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" placeholder="12345678" required><button class="join" id="joinButton" type="submit">🔗 ゲームに接続する</button></form></section>
<section id="resultPanel" hidden><div class="topline"><span class="game-code" id="gameCode"></span><button class="retry" id="changeCode" type="button">別のIDで接続</button></div><div class="stats"><div class="stat"><small>出た数字</small><strong id="drawCount">0 / 75</strong></div><div class="stat"><small>ビンゴ</small><strong id="bingoCount">0 枚</strong></div></div><h2 class="subhead">🎉 ビンゴしたカード</h2><p class="help">ピンク＝今回の抽選でビンゴ ／ グレー＝それ以前にビンゴ</p><div class="list" id="bingoList" aria-live="polite"></div></section>
<div class="status" role="status"><span class="dot" id="statusDot"></span><span id="statusText">ゲームIDを入力して接続してください</span></div><div id="error" class="error" hidden></div></main><footer class="foot">© 2021–2026 dobhar-chu</footer></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="./dango-firebase.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const CODE_RE=/^[0-9]{8}$/;
let activeRef=null,connected=false,cards=null,joinedId=null,unsubscribeConnection=null;
const lines=(grid)=>{const result=[];for(let r=0;r<5;r++)result.push(grid[r]);for(let c=0;c<5;c++)result.push(grid.map(row=>row[c]));result.push(grid.map((row,i)=>row[i]));result.push(grid.map((row,i)=>row[4-i]));return result;};
function won(grid,drawn){const got=new Set(drawn);return lines(grid).some(line=>line.every(n=>n===null||got.has(n)))}
function showError(text){$('error').textContent=text;$('error').hidden=!text}
function status(text,ok=false,warning=false){$('statusText').textContent=text;$('statusDot').className='dot'+(ok?' ok':warning?' no':'')}
function leave(){if(activeRef){activeRef.off();activeRef=null}joinedId=null;$('joinPanel').hidden=false;$('resultPanel').hidden=true;$('joinButton').disabled=false;showError('');status('ゲームIDを入力して接続してください')}
function validGrid(grid){if(!Array.isArray(grid)||grid.length!==5||grid[2]?.[2]!==null)return false;const seen=new Set();for(let r=0;r<5;r++)for(let c=0;c<5;c++){const n=grid[r]?.[c];if(r===2&&c===2)continue;if(!Number.isInteger(n)||n<c*15+1||n>(c+1)*15||seen.has(n))return false;seen.add(n)}return seen.size===24}
async function loadCards(){if(cards)return cards;const response=await fetch('./cards.json',{cache:'no-store'});if(!response.ok)throw Error('カードデータの読み込みに失敗しました');const data=await response.json();if(!Array.isArray(data.cards))throw Error('カードデータ形式が不正です');cards=new Map();for(const item of data.cards)if(item&&Number.isInteger(item.id)&&validGrid(item.grid)&&!cards.has(item.id))cards.set(item.id,item.grid);return cards}
function render(data){if(!data){status('このゲームは見つからないか、終了しています',false,true);showError('ゲームIDを確認してください。終了したゲームIDは使用できません。');$('bingoList').replaceChildren();return}
 const selected=Array.isArray(data.selectedCards)?data.selectedCards:[];
 const called=Array.isArray(data.drawn)?data.drawn:[];
 if(!selected.length||selected.some(id=>!cards.has(id))||called.some(n=>!Number.isInteger(n)||n<1||n>75)||new Set(called).size!==called.length){showError('同期データに異常があります。抽選担当に確認してください。');return}
 showError('');$('drawCount').textContent=called.length+' / 75';const before=called.slice(0,-1);const old=[],fresh=[];
 for(const id of selected){const grid=cards.get(id);if(won(grid,called)){(won(grid,before)?old:fresh).push(id)}}
 old.sort((a,b)=>a-b);fresh.sort((a,b)=>a-b);$('bingoCount').textContent=(fresh.length+old.length)+' 枚';const list=$('bingoList');list.replaceChildren();
 if(!fresh.length&&!old.length){const empty=document.createElement('div');empty.className='empty';empty.style.gridColumn='1/-1';empty.textContent='まだビンゴは出ていません。次の抽選を待っています！';list.appendChild(empty)}
 for(const [items,isNew] of [[fresh,true],[old,false]])for(const id of items){const chip=document.createElement('div');chip.className='chip'+(isNew?' new':'');const num=document.createElement('strong');num.textContent='No.'+String(id).padStart(3,'0');const cap=document.createElement('small');cap.textContent=isNew?'今回ビンゴ！':'過去のビンゴ';chip.append(num,cap);list.appendChild(chip)}
 status(connected?'リアルタイム同期中':'通信が切れています（最後に取得した結果を表示）',connected,!connected);
}
async function join(code){if(!CODE_RE.test(code)){showError('8桁の数字で入力してください');return}
 leave();$('joinButton').disabled=true;status('Firebaseに接続しています…');try{
 if(!window.DangoFirebase)throw Error(window.DangoFirebaseError||'Firebaseを読み込めませんでした');
 await Promise.all([window.DangoFirebase.signIn(),loadCards()]);joinedId=code;try{localStorage.setItem('dango.viewerCode.v1',code)}catch{}
 $('gameCode').textContent='ゲームID：'+code;$('resultPanel').hidden=false;$('joinPanel').hidden=true;
 activeRef=window.DangoFirebase.db.ref('sessions/'+code);
 activeRef.on('value',snap=>{if(joinedId!==code)return;render(snap.val())},err=>{showError('読み取りに失敗しました。Firebaseのルールを確認してください。 '+(err?.message||''));status('同期エラー',false,true)});
 }catch(err){$('joinButton').disabled=false;status('接続できませんでした',false,true);showError(err.message||String(err))}}
$('joinForm').addEventListener('submit',e=>{e.preventDefault();join($('codeInput').value.replace(/\D/g,''))});
$('changeCode').addEventListener('click',()=>{leave();history.replaceState(null,'','./watch.html')});
if(window.DangoFirebase){window.DangoFirebase.db.ref('.info/connected').on('value',snap=>{connected=!!snap.val();if(joinedId){status(connected?'リアルタイム同期中':'通信が切れています（最後に取得した結果を表示）',connected,!connected)}})}
const initial=new URL(location.href).searchParams.get('id');if(initial&&CODE_RE.test(initial)){ $('codeInput').value=initial;join(initial)}else{try{$('codeInput').value=localStorage.getItem('dango.viewerCode.v1')||''}catch{}}
</script></body></html>
